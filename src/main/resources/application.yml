# ── DAF360 HR Service — application.yml ──────────────────────────────────────
spring:
  application:
    name: rh-service

  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=daf360_hr;encrypt=true;trustServerCertificate=true}
    username: ${DB_USER:sa}
    password: ${DB_PASS:Timesheetdev2026!**}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

  mail:
    host: ${MAIL_HOST:smtp.office365.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  # Jackson date/time serialization is configured in JacksonConfig.java
  # (write-dates-as-timestamps was removed from Jackson 3.x SerializationFeature)
  jackson:
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${PORT:8888}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.daf360: INFO
    org.springframework.security: WARN

app:
  jwt-secret: ${JWT_SECRET:daf360-change-me-in-production-32chars}
  # Required to validate the portal's RS256 daf360_access cookie. Without it JwtService
  # falls back to HS256 and the signature check fails → 401 on every cookie-authed request.
  jwt-public-key-path: ${JWT_PUBLIC_KEY_PATH:}
  jwt-expiry-seconds: ${JWT_EXPIRY_SECONDS:3600}
  allowed-origins:
    - ${PORTAL_URL:http://localhost:8080}
    - ${RH_FRONTEND_URL:http://localhost:4201}
  storage-path:     ${STORAGE_PATH:./uploads/hr}
  hr-manager-email: ${HR_MANAGER_EMAIL:}
  finance-email:    ${FINANCE_EMAIL:}
  company-name:     ${COMPANY_NAME:DAF360}
  portal-url: ${PORTAL_URL:http://localhost:8080}
  mail-from: ${MAIL_FROM:noreply@daf360.com}
  pdf-service-url: ${PDF_SERVICE_URL:http://localhost:3000}
  # Shared secret for /api/hr/internal/** (log-service presence scheduler). MUST match
  # log-service's rh.internal-api-key. Blank = internal endpoints return 403.
  internal-api-key: ${INTERNAL_API_KEY:daf360-internal-change-me}
  # Microsoft Graph / SharePoint document storage — blank = disabled (GraphSharePointService
  # skips upload silently, local disk save is unaffected). Set these 3 as real env vars,
  # never as hardcoded defaults here.
  ms-graph-tenant-id: ${MS_GRAPH_TENANT_ID:}
  ms-graph-client-id: ${MS_GRAPH_CLIENT_ID:}
  ms-graph-client-secret: ${MS_GRAPH_CLIENT_SECRET:}
  sharepoint-site-hostname: ${SHAREPOINT_SITE_HOSTNAME:pinigroup.sharepoint.com}
  sharepoint-site-path: ${SHAREPOINT_SITE_PATH:/sites/pini-tunisia}

mail:
  enabled: ${MAIL_ENABLED:false}
  from: ${MAIL_FROM:noreply@daf360.com}

portal:
  url: ${PORTAL_URL:http://localhost:8080}
