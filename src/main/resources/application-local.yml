# ── DAF360 HR Service — local developer profile ───────────────────────────────
# Activates with: SPRING_PROFILES_ACTIVE=local  (set in .env)
# Values are read from .env via DotenvEnvironmentPostProcessor.
# DO NOT COMMIT this file — it may contain developer-specific paths.
server:
  port: ${PORT:8888}

spring:
  datasource:
    url: "${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=DAF360_HR;encrypt=false;trustServerCertificate=true}"
    username: ${DB_USER:sa}
    password: "${DB_PASS:}"

  jpa:
    show-sql: true
    hibernate:
      # Schema managed manually via SSMS scripts in local dev
      ddl-auto: none

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: "${MAIL_USERNAME:}"
    password: "${MAIL_PASSWORD:}"

mail:
  enabled:  true
  from:     HR.DAF@arx.ing

app:
  # Both of these must agree with the portal's own local profile, because the portal is
  # what SIGNS the token this service validates:
  #  - jwt-secret is the HS256 key of the `daf360_rh` cookie. It was still the generic
  #    production placeholder while the portal's local profile signs with
  #    "daf360-local-dev-jwt-secret-key-min-32-chars", so every HMAC token was rejected.
  #  - jwt-public-key-path verifies the RS256 `daf360_access` cookie. It pointed at another
  #    developer's home directory, so the file was missing here, JwtService logged
  #    "RS256 token received but JWT_PUBLIC_KEY_PATH not configured" and fell back to HS256
  #    on an RS256 token.
  # With both validation paths broken, EVERY authenticated /api/hr call answered 401 —
  # which the shell's authInterceptor turns into a logout.
  jwt-secret: ${JWT_SECRET:daf360-local-dev-jwt-secret-key-min-32-chars}
  jwt-public-key-path: ${JWT_PUBLIC_KEY_PATH:C:/Users/MSI/Desktop/daf360-dev/daf360-portal/keys/public.pem}

logging:
  level:
    com.daf360: DEBUG
    org.hibernate.SQL: DEBUG
    "[org.hibernate.orm.jdbc.bind]": TRACE
